services:
  mysql-pet:
    image: mysql:8.0
    container_name: pet-creche-db
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: creche_pet_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: