# =============================================
# PERFIL: produção
# Swagger DESATIVADO, logs enxutos, schema validado.
# =============================================
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
logging.level.org.hibernate.SQL=WARN

# Flyway é a única fonte de verdade do schema em produção.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Bootstrap do 1º ADMIN: ligar UMA vez no primeiro deploy com as variáveis
# APP_BOOTSTRAP_ADMIN_EMAIL / APP_BOOTSTRAP_ADMIN_PASSWORD definidas, criar o
# dono, trocar a senha e voltar para false.
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
