# =============================================
# PERFIL: desenvolvimento
# Swagger habilitado, logs verbosos.
# NÃO usar em produção.
# =============================================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
logging.level.com.particaolar=DEBUG
logging.level.org.hibernate.SQL=WARN

# Permite habilitar o bootstrap do 1º ADMIN apenas em dev, se desejar.
# As credenciais vêm de variáveis de ambiente (nunca do código).
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
