# =============================================
# Perfil ativo (dev | prod). Default: dev.
# Em produção defina SPRING_PROFILES_ACTIVE=prod
# =============================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================
# Database Configuration
# - Padrão: H2 em arquivo (sem MySQL/Docker).
# - Se DB_URL estiver definido, usa MySQL (necessita docker-compose para subir).
# =============================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/creche-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# =============================================
# JPA / Hibernate
# - H2 (padrão): create-drop — Hibernate cria o schema automaticamente.
# - MySQL: defina DDL_AUTO=validate e FLYWAY_ENABLED=true.
# =============================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =============================================
# Flyway (Migrations)
# - Desabilitado no H2 (schema criado pelo Hibernate).
# - Para MySQL: FLYWAY_ENABLED=true
# =============================================
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# =============================================
# Fuso horário (consistente em JVM, Jackson e JDBC)
# =============================================
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# =============================================
# JWT Configuration (OBRIGATÓRIO no produção; default seguro para dev local)
# =============================================
jwt.secret=${JWT_SECRET:dev_local_jwt_secret_at_least_32_chars_long_for_testing_only}
jwt.expiration=${JWT_EXPIRATION:3600000}

# =============================================
# CORS — origens permitidas (separadas por vírgula)
# =============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# =============================================
# Server Configuration
# =============================================
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# =============================================
# Actuator (health público; resto protegido via SecurityConfig)
# =============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# =============================================
# SpringDoc / OpenAPI — DESATIVADO por padrão.
# Só é habilitado explicitamente no perfil 'dev'.
# =============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# =============================================
# Logging (sem dados sensíveis)
# =============================================
logging.level.root=INFO
logging.level.com.particaolar=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================
# Request Limits
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# Capacidade operacional por modalidade (vagas por dia de calendário).
# Sobrescreva por ambiente: APP_CRECHE_CAPACIDADE_CRECHE / _HOTEL.
# =============================================
app.creche.capacidade.creche=${APP_CRECHE_CAPACIDADE_CRECHE:10}
app.creche.capacidade.hotel=${APP_CRECHE_CAPACIDADE_HOTEL:20}

# =============================================
# Jackson (JSON)
# =============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
