# =============================================
# Perfil ativo (dev | prod). Default: dev.
# Em produção defina SPRING_PROFILES_ACTIVE=prod
# =============================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================
# Database Configuration
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/creche_pet_db}
spring.datasource.username=${DB_USERNAME:app_user}
spring.datasource.password=${DB_PASSWORD:change_me_in_production}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate
# Flyway é a fonte de verdade do schema.
# 'validate' garante que a aplicação só suba se o schema casar com as entidades.
# =============================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =============================================
# Flyway (Migrations)
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# =============================================
# Fuso horário (consistente em JVM, Jackson e JDBC)
# =============================================
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# =============================================
# JWT Configuration (OBRIGATÓRIO via ambiente; sem default inseguro)
# =============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# =============================================
# CORS — origens permitidas (separadas por vírgula)
# =============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# =============================================
# Server Configuration
# =============================================
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# =============================================
# Actuator (health público; resto protegido via SecurityConfig)
# =============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# =============================================
# SpringDoc / OpenAPI — DESATIVADO por padrão.
# Só é habilitado explicitamente no perfil 'dev'.
# =============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# =============================================
# Logging (sem dados sensíveis)
# =============================================
logging.level.root=INFO
logging.level.com.particaolar=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================
# Request Limits
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# Capacidade operacional por modalidade (vagas por dia de calendário).
# Sobrescreva por ambiente: APP_CRECHE_CAPACIDADE_CRECHE / _HOTEL.
# =============================================
app.creche.capacidade.creche=${APP_CRECHE_CAPACIDADE_CRECHE:10}
app.creche.capacidade.hotel=${APP_CRECHE_CAPACIDADE_HOTEL:20}

# =============================================
# Jackson (JSON)
# =============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
